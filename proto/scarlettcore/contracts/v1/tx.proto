syntax = "proto3";

package scarlettcore.contracts.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "scarlettcore/contracts/v1/params.proto";

option go_package = "scarlett-core/x/contracts/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // StoreCode defines the StoreCode RPC.
  rpc StoreCode(MsgStoreCode) returns (MsgStoreCodeResponse);

  // InstantiateContract defines the InstantiateContract RPC.
  rpc InstantiateContract(MsgInstantiateContract) returns (MsgInstantiateContractResponse);

  // ExecuteContract defines the ExecuteContract RPC.
  rpc ExecuteContract(MsgExecuteContract) returns (MsgExecuteContractResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "scarlettcore/x/contracts/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgStoreCode defines the MsgStoreCode message.
message MsgStoreCode {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes wasm_byte_code = 2;
}

// MsgStoreCodeResponse defines the MsgStoreCodeResponse message.
message MsgStoreCodeResponse {}

// MsgInstantiateContract defines the MsgInstantiateContract message.
message MsgInstantiateContract {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 code_id = 2;
  bytes msg = 3;
  string label = 4;
  string funds = 5;
  string admin = 6;
}

// MsgInstantiateContractResponse defines the MsgInstantiateContractResponse message.
message MsgInstantiateContractResponse {}

// MsgExecuteContract defines the MsgExecuteContract message.
message MsgExecuteContract {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string contract = 2;
  bytes msg = 3;
  string funds = 4;
}

// MsgExecuteContractResponse defines the MsgExecuteContractResponse message.
message MsgExecuteContractResponse {}
