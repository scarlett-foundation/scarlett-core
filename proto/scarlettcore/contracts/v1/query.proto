syntax = "proto3";

package scarlettcore.contracts.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "scarlettcore/contracts/v1/params.proto";

option go_package = "scarlett-core/x/contracts/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/scarlett-core/contracts/v1/params";
  }

  // ContractInfo Queries a list of ContractInfo items.
  rpc ContractInfo(QueryContractInfoRequest) returns (QueryContractInfoResponse) {
    option (google.api.http).get = "/scarlett-core/contracts/v1/contract_info/{contract}";
  }

  // SmartContractState Queries a list of SmartContractState items.
  rpc SmartContractState(QuerySmartContractStateRequest) returns (QuerySmartContractStateResponse) {
    option (google.api.http).get = "/scarlett-core/contracts/v1/smart_contract_state/{contract}/{query_data}";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryContractInfoRequest defines the QueryContractInfoRequest message.
message QueryContractInfoRequest {
  string contract = 1;
}

// QueryContractInfoResponse defines the QueryContractInfoResponse message.
message QueryContractInfoResponse {
  // contract_address is the bech32 address of the contract
  string contract_address = 1;
  // creator is the bech32 address of the contract creator
  string creator = 2;
  // admin is the bech32 address of the contract admin (if any)
  string admin = 3;
  // code_id is the reference to the stored WASM code
  uint64 code_id = 4;
  // label is a human-readable name for this contract
  string label = 5;
  // created contains information about when the contract was created
  AbsoluteTxPosition created = 6;
  // ibc_port_id is the unique identifier for the IBC port (if IBC enabled)
  string ibc_port_id = 7;
}

// QuerySmartContractStateRequest defines the QuerySmartContractStateRequest message.
message QuerySmartContractStateRequest {
  string contract = 1;
  bytes query_data = 2;
}

// QuerySmartContractStateResponse defines the QuerySmartContractStateResponse message.
message QuerySmartContractStateResponse {
  // data is the raw bytes returned by the smart contract query
  bytes data = 1;
}

// AbsoluteTxPosition contains the block height and transaction index
message AbsoluteTxPosition {
  // block_height is the block the contract was created at
  uint64 block_height = 1;
  // tx_index is the transaction index within the block
  uint64 tx_index = 2;
}
