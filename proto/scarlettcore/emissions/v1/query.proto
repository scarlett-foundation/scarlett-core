syntax = "proto3";

package scarlettcore.emissions.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "scarlettcore/emissions/v1/params.proto";

option go_package = "scarlett-core/x/emissions/types";

// Query defines the gRPC querier service.
service Query {
  
  // Parameters queries the parameters of the module.
  rpc Params (QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/scarlett-core/emissions/v1/params";
  
  }
  
  // EmissionParams Queries a list of EmissionParams items.
  rpc EmissionParams (QueryEmissionParamsRequest) returns (QueryEmissionParamsResponse) {
    option (google.api.http).get = "/scarlett-core/emissions/v1/emission_params";
  
  }
  
  // EmissionHistory Queries a list of EmissionHistory items.
  rpc EmissionHistory (QueryEmissionHistoryRequest) returns (QueryEmissionHistoryResponse) {
    option (google.api.http).get = "/scarlett-core/emissions/v1/emission_history";
  
  }
  
  // DestinationStats Queries a list of DestinationStats items.
  rpc DestinationStats (QueryDestinationStatsRequest) returns (QueryDestinationStatsResponse) {
    option (google.api.http).get = "/scarlett-core/emissions/v1/destination_stats";
  
  }

  // ListRegisteredModules Queries all registered modules in the emissions registry.
  rpc ListRegisteredModules (QueryListRegisteredModulesRequest) returns (QueryListRegisteredModulesResponse) {
    option (google.api.http).get = "/scarlett-core/emissions/v1/registered_modules";
  
  }

  // GetRegisteredModule Queries a specific registered module by name.
  rpc GetRegisteredModule (QueryGetRegisteredModuleRequest) returns (QueryGetRegisteredModuleResponse) {
    option (google.api.http).get = "/scarlett-core/emissions/v1/registered_modules/{module_name}";
  
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  
  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// QueryEmissionParamsRequest defines the QueryEmissionParamsRequest message.
message QueryEmissionParamsRequest {}

// QueryEmissionParamsResponse defines the QueryEmissionParamsResponse message.
message QueryEmissionParamsResponse {}

// QueryEmissionHistoryRequest defines the QueryEmissionHistoryRequest message.
message QueryEmissionHistoryRequest {}

// QueryEmissionHistoryResponse defines the QueryEmissionHistoryResponse message.
message QueryEmissionHistoryResponse {}

// QueryDestinationStatsRequest defines the QueryDestinationStatsRequest message.
message QueryDestinationStatsRequest {}

// QueryDestinationStatsResponse defines the QueryDestinationStatsResponse message.
message QueryDestinationStatsResponse {}

// QueryListRegisteredModulesRequest defines the request for listing all registered modules.
message QueryListRegisteredModulesRequest {
  // pagination defines an optional pagination for the request.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// RegisteredModuleInfo defines the information about a registered module for queries.
message RegisteredModuleInfo {
  string module_name = 1;
  string creator = 2;
  string description = 3;
  string status = 4;
  string created_at = 5;
  string updated_at = 6;
}

// QueryListRegisteredModulesResponse defines the response for listing all registered modules.
message QueryListRegisteredModulesResponse {
  repeated RegisteredModuleInfo modules = 1;
  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryGetRegisteredModuleRequest defines the request for getting a specific registered module.
message QueryGetRegisteredModuleRequest {
  string module_name = 1;
}

// QueryGetRegisteredModuleResponse defines the response for getting a specific registered module.
message QueryGetRegisteredModuleResponse {
  RegisteredModuleInfo module = 1;
}

