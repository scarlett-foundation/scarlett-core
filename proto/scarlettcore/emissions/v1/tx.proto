syntax = "proto3";

package scarlettcore.emissions.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "scarlettcore/emissions/v1/params.proto";

option go_package = "scarlett-core/x/emissions/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // UpdateEmissionSplit defines the UpdateEmissionSplit RPC.
  rpc UpdateEmissionSplit(MsgUpdateEmissionSplit) returns (MsgUpdateEmissionSplitResponse);

  // AddEmissionDestination defines the AddEmissionDestination RPC.
  rpc AddEmissionDestination(MsgAddEmissionDestination) returns (MsgAddEmissionDestinationResponse);

  // RemoveEmissionDestination defines the RemoveEmissionDestination RPC.
  rpc RemoveEmissionDestination(MsgRemoveEmissionDestination) returns (MsgRemoveEmissionDestinationResponse);

  // ToggleEmissionDestination defines the ToggleEmissionDestination RPC.
  rpc ToggleEmissionDestination(MsgToggleEmissionDestination) returns (MsgToggleEmissionDestinationResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "scarlettcore/x/emissions/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgUpdateEmissionSplit defines the MsgUpdateEmissionSplit message.
message MsgUpdateEmissionSplit {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated string destinations = 2;
  repeated string weights = 3;
  string reason = 4;
}

// MsgUpdateEmissionSplitResponse defines the MsgUpdateEmissionSplitResponse message.
message MsgUpdateEmissionSplitResponse {}

// MsgAddEmissionDestination defines the MsgAddEmissionDestination message.
message MsgAddEmissionDestination {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string module = 2;
  string weight = 3;
  string description = 4;
  string reason = 5;
}

// MsgAddEmissionDestinationResponse defines the MsgAddEmissionDestinationResponse message.
message MsgAddEmissionDestinationResponse {}

// MsgRemoveEmissionDestination defines the MsgRemoveEmissionDestination message.
message MsgRemoveEmissionDestination {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string module = 2;
  string reason = 3;
}

// MsgRemoveEmissionDestinationResponse defines the MsgRemoveEmissionDestinationResponse message.
message MsgRemoveEmissionDestinationResponse {}

// MsgToggleEmissionDestination defines the MsgToggleEmissionDestination message.
message MsgToggleEmissionDestination {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string module = 2;
  bool enabled = 3;
  string reason = 4;
}

// MsgToggleEmissionDestinationResponse defines the MsgToggleEmissionDestinationResponse message.
message MsgToggleEmissionDestinationResponse {}
