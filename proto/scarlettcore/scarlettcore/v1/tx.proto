syntax = "proto3";

package scarlettcore.scarlettcore.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "scarlettcore/scarlettcore/v1/params.proto";

option go_package = "scarlett-core/x/scarlettcore/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // BurnTokens defines the BurnTokens RPC.
  rpc BurnTokens(MsgBurnTokens) returns (MsgBurnTokensResponse);

  // BurnGenesisStake defines the BurnGenesisStake RPC.
  rpc BurnGenesisStake(MsgBurnGenesisStake) returns (MsgBurnGenesisStakeResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "scarlettcore/x/scarlettcore/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgBurnTokens defines the MsgBurnTokens message.
message MsgBurnTokens {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string amount = 2;
  string denom = 3;
}

// MsgBurnTokensResponse defines the MsgBurnTokensResponse message.
message MsgBurnTokensResponse {}

// MsgBurnGenesisStake defines the MsgBurnGenesisStake message.
message MsgBurnGenesisStake {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string amount = 2; // Amount to burn (e.g. "50000000sclt")
}

// MsgBurnGenesisStakeResponse defines the MsgBurnGenesisStakeResponse message.
message MsgBurnGenesisStakeResponse {
  // unbonded_amount is the amount that will be burned after unbonding period
  string unbonded_amount = 1;
  // unbonding_completion_time is when the tokens will be available for burning
  int64 unbonding_completion_time = 2;
}
