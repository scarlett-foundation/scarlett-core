syntax = "proto3";
package scarlettcore.scarlettcore.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "scarlettcore/scarlettcore/v1/params.proto";

option go_package = "scarlett-core/x/scarlettcore/types";

// GenesisState defines the scarlettcore module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
